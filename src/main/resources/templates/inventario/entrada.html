<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Registrar Entrada</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">


    <div class="card shadow">


        <div class="card-header bg-success text-white">

            <h3>
                Registrar Entrada de Productos
            </h3>

        </div>



        <div class="card-body">


            <form th:action="@{/inventario/entrada}"
                  method="post">



                <!-- Producto -->

                <div class="mb-3">

                    <label class="form-label">
                        Producto
                    </label>


                    <select
                            class="form-select"
                            name="productoId">


                        <option
                                th:each="p : ${productos}"
                                th:value="${p.id}"
                                th:text="${p.nombre}">

                        </option>


                    </select>


                </div>




                <!-- Cantidad -->

                <div class="mb-3">


                    <label class="form-label">
                        Cantidad
                    </label>


                    <input
                            type="number"
                            class="form-control"
                            name="cantidad"
                            min="1"
                            required>


                </div>




                <!-- Observación -->

                <div class="mb-3">


                    <label class="form-label">
                        Observación
                    </label>


                    <input
                            type="text"
                            class="form-control"
                            name="observacion"
                            placeholder="Ejemplo: Compra proveedor">


                </div>




                <button
                        type="submit"
                        class="btn btn-success">

                    Registrar Entrada

                </button>



                <a href="/inventario"
                   class="btn btn-secondary">

                    Volver

                </a>



            </form>



        </div>


    </div>


</div>



</body>


</html>
